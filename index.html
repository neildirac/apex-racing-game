<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10191d">
<title>APEX — 彎道疾行</title>
<style>
:root{color-scheme:dark;--orange:#ff5935}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#94cbd0;color:#fff;font-family:Inter,"Noto Sans TC",system-ui,sans-serif}canvas{display:block}.hud{position:fixed;inset:0;padding:24px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 9px #1119}.brand{font-size:20px;font-weight:950;letter-spacing:.11em}.tag{font-size:10px;letter-spacing:.2em;opacity:.75;margin-top:5px}.box{background:#10191dcc;border:1px solid #ffffff2c;border-radius:14px;padding:14px 18px;min-width:148px;backdrop-filter:blur(10px)}.speed{font-size:34px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums}.unit{font-size:10px;letter-spacing:.15em;opacity:.7;margin-top:5px}.lap{font-size:13px;margin-top:12px}.help{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10191dcc;border:1px solid #ffffff24;border-radius:99px;padding:10px 17px;font-size:12px;white-space:nowrap;pointer-events:none}.key{display:inline-block;border:1px solid #ffffff75;border-radius:5px;padding:2px 7px;margin:0 2px;background:#ffffff1b}.message{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,5vw,48px);font-weight:950;letter-spacing:.08em;text-shadow:0 3px 16px #0009;opacity:0;transition:opacity .25s;pointer-events:none}.message.show{opacity:1}@media(max-width:560px){.hud{padding:16px}.brand{font-size:16px}.help{font-size:10px;bottom:12px;padding:9px 12px}.box{min-width:116px;padding:12px}.speed{font-size:28px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
</head>
<body>
<div class="hud"><div><div class="brand">APEX <span style="color:var(--orange)">/</span> 彎道疾行</div><div class="tag">ARCADE RACING · PROTOTYPE 01</div></div><div class="box"><div class="speed" id="speed">000</div><div class="unit">KM/H</div><div class="lap">圈數　<span id="lap">1</span> / 3</div></div></div>
<div class="help"><span class="key">↑</span> 加速　<span class="key">↓</span> 煞車　<span class="key">←</span><span class="key">→</span> 轉向　<span class="key">Space</span> 手煞車　<span class="key">R</span> 重置</div><div class="message" id="message">完賽！</div>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9acbd0);scene.fog=new THREE.Fog(0x9acbd0,95,250);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9fbff,0x526948,2));const sun=new THREE.DirectionalLight(0xfff0d4,3.1);sun.position.set(-42,65,-24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-105;sun.shadow.camera.right=105;sun.shadow.camera.top=105;sun.shadow.camera.bottom=-105;scene.add(sun);
const material=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=material(0x538353),asphalt=material(0x353a3d),white=material(0xf4eee0),red=material(0xef503e);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grass);floor.rotation.x=-Math.PI/2;floor.position.y=-.35;floor.receiveShadow=true;scene.add(floor);
const RX=52,RZ=36,W=12,N=480;const point=t=>new THREE.Vector3(RX*Math.cos(t),0,RZ*Math.sin(t));const tangent=t=>new THREE.Vector3(-RX*Math.sin(t),0,RZ*Math.cos(t)).normalize();
function strip(offsetA,offsetB,mat,y){const pos=[],idx=[];for(let i=0;i<=N;i++){const t=i/N*Math.PI*2,p=point(t),v=tangent(t),s=new THREE.Vector3(v.z,0,-v.x);for(const d of [offsetA,offsetB]){const q=p.clone().addScaledVector(s,d);pos.push(q.x,y,q.z)}if(i<N){const a=i*2;idx.push(a,a+2,a+1,a+1,a+2,a+3)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,mat))}
strip(-W/2,W/2,asphalt,.015);strip(-W/2-.45,-W/2+.45,red,.075);strip(W/2-.45,W/2+.45,white,.075);
for(let i=0;i<96;i++){const t=i/96*Math.PI*2,p=point(t),v=tangent(t);const d=new THREE.Mesh(new THREE.BoxGeometry(.16,.025,.9),white);d.position.set(p.x,.08,p.z);d.rotation.y=Math.atan2(v.x,v.z);scene.add(d)}
const gate=new THREE.Mesh(new THREE.BoxGeometry(.75,.06,W),white);gate.position.set(RX,.1,0);gate.rotation.y=Math.PI/2;scene.add(gate);
// Simple forest and low hills around the circuit.
for(let i=0;i<110;i++){const t=i/110*Math.PI*2,p=point(t),v=tangent(t),s=new THREE.Vector3(v.z,0,-v.x);for(const sign of [-1,1])if(Math.random()<.9){const q=p.clone().addScaledVector(s,sign*(W/2+5+Math.random()*17)),h=2.4+Math.random()*5;const tree=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.23,h*.32,6),material(0x745235));trunk.position.y=h*.16;tree.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.8+Math.random()*.7,h*.72,7),material([0x2e6743,0x39784a,0x4b8652][i%3]));crown.position.y=h*.62;tree.add(crown);tree.position.set(q.x,0,q.z);tree.rotation.y=Math.random()*6;tree.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(tree)}}
for(let i=0;i<24;i++){const a=i/24*Math.PI*2,hill=new THREE.Mesh(new THREE.ConeGeometry(15+Math.random()*14,12+Math.random()*15,6),material(0x7da17a));hill.position.set(Math.cos(a)*145,-2,Math.sin(a)*115);scene.add(hill)}
const car=new THREE.Group();scene.add(car);const paint=new THREE.MeshStandardMaterial({color:0xff5836,metalness:.18,roughness:.32});const chassis=new THREE.Mesh(new THREE.BoxGeometry(2,.58,4),paint);chassis.position.y=.72;chassis.castShadow=true;car.add(chassis);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,.68,1.8),material(0x183943,.28));cabin.position.set(0,1.28,-.18);cabin.castShadow=true;car.add(cabin);const windshield=new THREE.Mesh(new THREE.BoxGeometry(1.36,.46,1.48),new THREE.MeshStandardMaterial({color:0x9ed8db,metalness:.3,roughness:.2,transparent:true,opacity:.65}));windshield.position.set(0,1.32,-.18);car.add(windshield);const wheels=[];for(const x of [-1.04,1.04])for(const z of [-1.28,1.28]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.32,16),material(0x171a1d,.95));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.44,z);wheel.castShadow=true;car.add(wheel);wheels.push(wheel)}for(const x of [-.66,.66]){const light=new THREE.Mesh(new THREE.BoxGeometry(.4,.14,.06),new THREE.MeshBasicMaterial({color:0xfff3c4}));light.position.set(x,.8,-2.03);car.add(light)}
const keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')reset()});addEventListener('keyup',e=>keys[e.code]=false);
let angle=Math.PI,speed=0,lap=1,lastT=0,finished=false;const clock=new THREE.Clock();const speedEl=document.querySelector('#speed'),lapEl=document.querySelector('#lap'),message=document.querySelector('#message');
function reset(){car.position.set(RX-3,0,0);angle=Math.PI;speed=0;lap=1;lastT=0;finished=false;lapEl.textContent='1';message.classList.remove('show')}
function update(){requestAnimationFrame(update);const dt=Math.min(clock.getDelta(),.04),gas=keys.ArrowUp||keys.KeyW,brake=keys.ArrowDown||keys.KeyS,steer=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);speed+=gas?25*dt:0;speed-=brake?36*dt:0;speed*=Math.pow(keys.Space?.965:.989,dt*60);speed=THREE.MathUtils.clamp(speed,-9,46);angle+=steer*dt*(.78+Math.abs(speed)*.043)*Math.sign(speed||1);const forward=new THREE.Vector3(-Math.sin(angle),0,-Math.cos(angle));car.position.addScaledVector(forward,speed*dt);
let t=Math.atan2(car.position.z/RZ,car.position.x/RX);if(t<0)t+=Math.PI*2;const q=point(t),dist=Math.hypot(car.position.x-q.x,car.position.z-q.z);if(dist>W*.68)speed*=Math.pow(.7,dt*60);if(lastT>5.8&&t<.35&&speed>5&&!finished){lap++;if(lap>=4){lap=3;finished=true;message.classList.add('show')}lapEl.textContent=String(lap)}lastT=t;car.rotation.y=angle;wheels.forEach(w=>w.rotation.x-=speed*dt*1.8);const target=car.position.clone().add(new THREE.Vector3(Math.sin(angle)*10,7,Math.cos(angle)*10));camera.position.lerp(target,1-Math.exp(-4*dt));const look=car.position.clone().addScaledVector(forward,8);look.y+=1.2;camera.lookAt(look);speedEl.textContent=String(Math.round(Math.abs(speed)*4)).padStart(3,'0');renderer.render(scene,camera)}
reset();camera.position.set(RX+14,9,5);update();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
